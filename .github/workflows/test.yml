name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.9.5, v0.10.4, v0.11.5, v0.12.5, stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - run: nvim -l tests/run.lua
      - name: Render Tree-sitter and LSP overlap
        run: nvim -l tests/render.lua
        timeout-minutes: 2
